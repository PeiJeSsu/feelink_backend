name: Coverage
on:
  workflow_call:
jobs:
  Coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build and run tests
        run: mvn clean test
      - name: Check coverage threshold
        run: mvn verify